//--------------------------------------------------------------
// 拍卖行配置（conf/battle/auction.conf）
// 热重载：@reloadbattleconf 即时生效；费率对已上架行不追溯（escrow 时锁定）。
// 规格：nostalro-client/docs/auction-house-design-2026-11-11.md §7
//--------------------------------------------------------------

// 总开关：0=全系统关闭（所有 CZ 静默拒绝 reason=1）
auction_enable: 0

// --- 币种与费率 ---
// cash（#CASHPOINTS）币种总开关
auction_allow_cash: 1
// 手续费（千分比），成交时从货款扣除；zeny 与 cash 独立可调
auction_fee_permille: 50
auction_cash_fee_permille: 50
// 上架押金（千分比，按起拍价计，取消/流拍退还）；0=不收
auction_deposit_permille: 0

// --- 挂单规则 ---
// 时长档位（小时，五个槽位，0=不启用）
auction_duration1: 12
auction_duration2: 24
auction_duration3: 48
auction_duration4: 0
auction_duration5: 0
// 每账号同时在售上限
auction_max_listings: 20
// 起拍价下限（单币种最小值）
auction_min_price: 1
// 最小加价 = max(min_increment, 现价*percent/100)，同币种
auction_min_increment: 100
auction_min_increment_percent: 1
// 一口价必须 >= 起拍价的百分比
auction_buynow_min_ratio: 100

// --- 上架校验 ---
// 绑定物品（bound>0）禁止上架：1=禁
auction_ban_bound_items: 1
// named（unique_id>0）物品允许上架：1=允许
auction_allow_named_items: 1
// 限时租借物品（expire_time>0）禁止上架：1=禁
auction_ban_rental_items: 1

// --- 结算与对账 ---
// 到期扫描周期（毫秒，map 端 tick）
auction_settle_scan_interval: 30000
// （char 端对账旋钮在 char_athena.conf，见 int_auction_custom.cpp）

// --- 频率限制（服务端计时，超限 reason=12）---
auction_register_interval: 2000
auction_search_interval: 1000
auction_bid_interval: 500
