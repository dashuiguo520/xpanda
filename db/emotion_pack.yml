###########################################################################
# Emotion Pack Database
###########################################################################
# Root entry loaded by the map server (db_path = "db").
# Renewal data lives in db/re/emotion_pack.yml, pre-renewal data in
# db/pre-re/emotion_pack.yml, and user overrides in db/import/emotion_pack.yml.
###########################################################################

Header:
  Type: EMOTION_PACK_DB
  Version: 1

Footer:
  Imports:
  - Path: db/pre-re/emotion_pack.yml
    Mode: Prerenewal
  - Path: db/re/emotion_pack.yml
    Mode: Renewal
  - Path: db/import/emotion_pack.yml
